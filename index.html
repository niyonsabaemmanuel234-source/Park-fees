<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>RDB Park Fee System</title>

  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: linear-gradient(135deg, #1e3c72, #2a5298);
      color: #333;
    }

    /* ===== WELCOME SCREEN ===== */
    .welcome {
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      text-align: center;
      color: white;
    }

    .welcome-box {
      background: rgba(0,0,0,0.3);
      padding: 40px;
      border-radius: 15px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.3);
    }

    .welcome h1 {
      font-size: 34px;
      margin-bottom: 10px;
    }

    .welcome p {
      font-size: 18px;
      margin-bottom: 20px;
    }

    .welcome button {
      padding: 12px 25px;
      font-size: 18px;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      background: white;
      color: #2a5298;
      font-weight: bold;
    }

    /* ===== CALCULATOR ===== */
    header {
      background: #0f2a4d;
      color: white;
      padding: 15px;
      text-align: center;
      font-size: 20px;
    }

    .container {
      max-width: 520px;
      margin: 40px auto;
      background: white;
      padding: 25px;
      border-radius: 12px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.2);
    }

    h2 {
      text-align: center;
      color: #2a5298;
    }

    label {
      display: block;
      margin-top: 15px;
      font-weight: bold;
    }

    select, input {
      width: 100%;
      padding: 10px;
      margin-top: 5px;
      border-radius: 8px;
      border: 1px solid #ccc;
      font-size: 16px;
    }

    button.calc {
      width: 100%;
      margin-top: 20px;
      padding: 12px;
      background: #2a5298;
      color: white;
      border: none;
      border-radius: 8px;
      font-size: 18px;
      cursor: pointer;
    }

    button.calc:hover {
      background: #1e3c72;
    }

    .result {
      margin-top: 20px;
      padding: 15px;
      background: #f4f6f9;
      border-radius: 8px;
      display: none;
    }

    .total {
      font-weight: bold;
      color: green;
      font-size: 18px;
    }

    .back {
      margin-top: 15px;
      text-align: center;
    }

    .back button {
      background: none;
      border: none;
      color: #2a5298;
      font-weight: bold;
      cursor: pointer;
      font-size: 16px;
    }

    /* Hide calculator at start */
    #calculatorPage {
      display: none;
    }
  </style>
</head>

<body>

<!-- ================= WELCOME PAGE ================= -->
<div class="welcome" id="welcomePage">
  <div class="welcome-box">
    <h1>🌍 Rwanda Park System</h1>
    <p>Quickly calculate national park entry fees with tax included</p>
    <button onclick="openCalculator()">Start System</button>
  </div>
</div>

<!-- ================= CALCULATOR PAGE ================= -->
<div id="calculatorPage">

  <header>
    Rwanda Development Board - Park Fee Calculator
  </header>

  <div class="container">

    <h2>Calculate Entry Fees</h2>

    <label>Choose Park</label>
    <select id="park">
      <option value="">-- Select Park --</option>
      <option value="volcanoes">Volcanoes National Park</option>
      <option value="nyungwe">Nyungwe National Park</option>
      <option value="akagera">Akagera National Park</option>
    </select>

    <label>Residency</label>
    <select id="residency">
      <option value="">-- Select Residency --</option>
      <option value="citizen">Rwandan Citizen</option>
      <option value="eac">EAC Resident</option>
      <option value="foreigner">Foreigner</option>
    </select>

    <label>Number of Visitors</label>
    <input type="number" id="visitors" min="1" placeholder="Enter number">

    <button class="calc" onclick="calculateFee()">Calculate</button>

    <div class="result" id="result">
      <p id="pricePerPerson"></p>
      <p id="subtotal"></p>
      <p id="tax"></p>
      <p class="total" id="total"></p>
    </div>

    <div class="back">
      <button onclick="goBack()">⬅ Back to Welcome</button>
    </div>

  </div>
</div>

<script>
  // show calculator
  function openCalculator() {
    document.getElementById("welcomePage").style.display = "none";
    document.getElementById("calculatorPage").style.display = "block";
  }

  // go back to welcome
  function goBack() {
    document.getElementById("calculatorPage").style.display = "none";
    document.getElementById("welcomePage").style.display = "flex";
  }

  // pricing data
  const pricing = {
    volcanoes: {
      citizen: 15000,
      eac: 30000,
      foreigner: 150000
    },
    nyungwe: {
      citizen: 10000,
      eac: 20000,
      foreigner: 100000
    },
    akagera: {
      citizen: 8000,
      eac: 15000,
      foreigner: 75000
    }
  };

  function calculateFee() {
    const park = document.getElementById("park").value;
    const residency = document.getElementById("residency").value;
    const visitors = parseInt(document.getElementById("visitors").value);

    if (!park || !residency || !visitors || visitors <= 0) {
      alert("Please fill all fields correctly!");
      return;
    }

    const price = pricing[park][residency];
    const subtotal = price * visitors;
    const tax = subtotal * 0.18;
    const total = subtotal + tax;

    document.getElementById("pricePerPerson").innerText =
      "Price per Person: " + price.toLocaleString() + " RWF";

    document.getElementById("subtotal").innerText =
      "Subtotal: " + subtotal.toLocaleString() + " RWF";

    document.getElementById("tax").innerText =
      "Tax (18%): " + tax.toLocaleString() + " RWF";

    document.getElementById("total").innerText =
      "Total Cost: " + total.toLocaleString() + " RWF";

    document.getElementById("result").style.display = "block";
  }
</script>
</body>
</html>
